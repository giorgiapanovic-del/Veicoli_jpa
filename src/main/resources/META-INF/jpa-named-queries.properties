bici.selectByFilter = select b from Bici b \
left join b.veicoli v \
left join b.tipoSospensione ts \
where (:id is null or b.id = :id) \
and (:numeroCorone is null or b.numeroCorone = :numeroCorone) \
and (:numeroMarce is null or b.numeroMarce = :numeroMarce) \
and (:tipoFreno is null or b.tipoFreno like :tipoFreno%) \
and (:idTipoSospensione is null or ts.id = :idTipoSospensione) \
and (:pieghevole is null or b.pieghevole = :pieghevole) \
order by b.id asc

macchina.selectByFilter = select m from Macchina m \
left join m.veicoli v \
where (:id is null or m.id = :id) \
and (:targa is null or m.targa like :targa%) \
and (:cc is null or m.cc = :cc) \
and (:numeroPorte is null or m.numeroPorte = :numeroPorte) \
order by m.id asc

moto.selectByFilter = select mo from Moto mo \
left join mo.veicoli v \
where (:id is null or mo.id = :id) \
and (:targa is null or mo.targa like :targa%) \
and (:cc is null or mo.cc = :cc) \
order by mo.id asc

veicoli.selectByFilter = select v from Veicoli v \
left join v.tipoVeicolo tv \
left join v.tipoAlimentazione ta \
left join v.categoria cat \
left join v.colore col \
left join v.marca mar \
where (:id is null or v.id = :id) \
and (:idTipoVeicolo is null or tv.id = :idTipoVeicolo) \
and (:numeroRuote is null or v.numeroRuote = :numeroRuote) \
and (:idTipoAlimentazione is null or ta.id = :idTipoAlimentazione) \
and (:idCategoria is null or cat.id = :idCategoria) \
and (:idColore is null or col.id = :idColore) \
and (:idMarca is null or mar.id = :idMarca) \
and (:annoProduzione is null or v.annoProduzione = :annoProduzione) \
and (:modello is null or v.modello like :modello%) \
order by v.id asc